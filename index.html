<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="tts-base-url" content="https://translate.googleapis.com" />
  <!-- Optional: override the TTS fallback service base URL -->
  <!-- <meta name="tts-base-url" content="https://your-tts-service.example.com" /> -->
  <title>Speech to IPA</title>
  <link rel="stylesheet" href="styles.css?v=20260726a" />
</head>
<body>
  <div id="waking-overlay" class="waking-overlay hidden" role="status" aria-live="polite" aria-hidden="true">
    <div class="waking-overlay-card">
      <div class="waking-spinner" aria-hidden="true"></div>
      <p class="waking-title">Waking up the voice server…</p>
      <p class="small">The first request of the day can take up to a minute. Thanks for your patience!</p>
      <button type="button" id="waking-dismiss" class="secondary">Continue anyway</button>
    </div>
  </div>

  <section class="settings" aria-label="Language selection">
    <div class="field">
      <label class="field-title" for="target-lang">Target language (L2):</label>
      <select id="target-lang"></select>
    </div>
    <div class="field">
      <label class="field-title" for="base-lang">Base language (L1):</label>
      <select id="base-lang"></select>
    </div>
    <div class="field">
      <label class="field-title" for="lesson-select">Lesson:</label>
      <select id="lesson-select"></select>
    </div>
    <div class="field">
      <label for="approx-slider" class="sr-only">Accuracy</label>
      <div class="range-meta">
        <p id="approx-label" class="field-title">Accuracy 50%</p>
      </div>
      <input id="approx-slider" type="range" min="0" max="5" step="1" value="0" />
    </div>
  </section>

  <main id="app" class="card" aria-live="polite">
    <div class="sentence" id="sentence"></div>
    <div class="controls">
      <button id="play-btn">▶ Play</button>
      <button id="slow-btn">🐢 Slow</button>
      <button id="record-btn">🎙️ Record</button>
      <button id="stop-btn" class="secondary">⏹ Stop</button>
      <button id="next-btn" class="secondary">Next sentence ➡</button>
    </div>
    <div id="playback-warnings" class="status status-inline" role="status" aria-live="polite"></div>
    <div id="status" class="status"></div>
    <div id="transcript" class="transcript" aria-live="polite"></div>
    <div id="feedback" class="feedback" aria-live="polite"></div>
  </main>

  <div id="custom-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="custom-modal-title">
      <button class="modal-close" type="button" data-close-modal aria-label="Close custom text dialog">
        ✕
      </button>
      <h2 id="custom-modal-title">Practice custom text</h2>
      <p class="small">Use your own text without losing your lesson progress.</p>

      <div class="fetch-panel" id="fetch-panel">
        <div class="fetch-panel-head">
          <span class="fetch-panel-title">✨ Fetch a passage</span>
          <span class="small" id="fetch-panel-sub">A real, dated passage from a plain-language encyclopedia.</span>
        </div>
        <div class="fetch-buttons">
          <button type="button" class="secondary" data-fetch-length="short">Short</button>
          <button type="button" class="secondary" data-fetch-length="medium">Medium</button>
          <button type="button" class="secondary" data-fetch-length="long">Long</button>
        </div>
        <div id="fetch-status" class="status status-inline" role="status" aria-live="polite"></div>
        <div id="fetch-citation" class="fetch-citation hidden"></div>
      </div>

      <div class="custom-field">
        <label for="custom-sentence">Custom practice</label>
        <textarea
          id="custom-sentence"
          rows="4"
          placeholder="Type or paste a sentence to practice"
          aria-label="Custom sentence input"
        ></textarea>
        <div class="custom-actions">
          <button id="custom-submit">Practice this sentence</button>
          <button id="custom-reset" class="secondary">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js?v=20260726a"></script>
</body>
</html>
