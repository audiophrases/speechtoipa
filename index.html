<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Optional: override the TTS fallback service base URL (defaults to translate.googleapis.com) -->
  <!-- <meta name="tts-base-url" content="https://your-tts-service.example.com"> -->
  <title>Read • Listen • Speak</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Read • Listen • Speak</h1>
    <p class="tagline">Practice reading, listening and pronunciation step by step.</p>
  </header>

  <section class="settings" aria-label="Language selection">
    <div class="field">
      <label for="target-lang">Target language (L2):</label>
      <select id="target-lang"></select>
    </div>
    <div class="field">
      <label for="voice-select">Voice for target language:</label>
      <select id="voice-select"></select>
      <p id="voice-note" class="small"></p>
    </div>
    <div class="field">
      <label for="base-lang">Base language (L1):</label>
      <select id="base-lang"></select>
    </div>
    <div class="field">
      <label for="lesson-select">Lesson:</label>
      <select id="lesson-select"></select>
    </div>
    <div class="field">
      <label for="approx-slider">Approximation tolerance:</label>
      <input id="approx-slider" type="range" min="0" max="5" step="1" value="2" />
      <div class="range-meta">
        <p id="approx-label" class="small">Approximation tolerance: for Accuracy 70%:</p>
      </div>
    </div>
  </section>

  <main id="app" class="card" aria-live="polite">
    <div class="sentence" id="sentence"></div>
    <div class="controls">
      <button id="play-btn">▶ Play</button>
      <button id="slow-btn">🐢 Slow</button>
      <button id="record-btn">🎙️ Record</button>
      <button id="stop-btn" class="secondary">⏹ Stop</button>
      <button id="next-btn" class="secondary">Next sentence ➡</button>
    </div>
    <div id="playback-warnings" class="status status-inline" role="status" aria-live="polite"></div>
    <div id="status" class="status"></div>
    <div id="transcript" class="transcript" aria-live="polite"></div>
    <div id="feedback" class="feedback" aria-live="polite"></div>
  </main>

  <div id="custom-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="custom-modal-title">
      <button class="modal-close" type="button" data-close-modal aria-label="Close custom text dialog">
        ✕
      </button>
      <h2 id="custom-modal-title">Practice custom text</h2>
      <p class="small">Use your own text without losing your lesson progress.</p>

      <div class="custom-field">
        <label for="custom-sentence">Custom practice</label>
        <textarea
          id="custom-sentence"
          rows="4"
          placeholder="Type or paste a sentence to practice"
          aria-label="Custom sentence input"
        ></textarea>
        <div class="custom-actions">
          <button id="custom-submit">Practice this sentence</button>
          <button id="custom-reset" class="secondary">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
