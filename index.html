<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Read • Listen • Speak</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Read • Listen • Speak</h1>
    <p class="tagline">Practice reading, listening and pronunciation step by step.</p>
  </header>

  <section class="settings" aria-label="Language selection">
    <div class="field">
      <label for="target-lang">Target language (L2):</label>
      <select id="target-lang"></select>
    </div>
    <div class="field">
      <label for="base-lang">Base language (L1):</label>
      <select id="base-lang"></select>
    </div>
    <div class="field">
      <label for="lesson-select">Lesson:</label>
      <select id="lesson-select"></select>
    </div>
    <div class="field custom-field">
      <label for="custom-sentence">Custom practice</label>
      <textarea
        id="custom-sentence"
        rows="3"
        placeholder="Type or paste a sentence to practice"
        aria-label="Custom sentence input"
      ></textarea>
      <div class="custom-actions">
        <button id="custom-submit">Practice this sentence</button>
        <button id="custom-reset" class="secondary">Back to lessons</button>
      </div>
      <p class="small">Submit a custom sentence without losing your lesson progress.</p>
    </div>
  </section>

  <main id="app" class="card" aria-live="polite">
    <div class="sentence" id="sentence"></div>
    <div class="controls">
      <button id="play-btn">▶ Play</button>
      <button id="slow-btn">🐢 Slow</button>
      <button id="record-btn">🎙️ Record</button>
      <button id="stop-btn" class="secondary">⏹ Stop</button>
      <button id="next-btn" class="secondary">Next sentence ➡</button>
    </div>
    <div id="status" class="status"></div>
    <div id="transcript" class="transcript" aria-live="polite"></div>
    <div id="feedback" class="feedback" aria-live="polite"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
