# Render Blueprint — https://render.com/docs/blueprint-spec
# In the Render dashboard: New + > Blueprint > pick this repo. Render reads
# this file and pre-fills the service below; no manual config needed.
#
# The server serves both the app's static files (index.html/app.js/styles.css,
# one directory above server/) and the neural TTS + dictation-fetch APIs from
# a single process — see server/server.js. Free tier: sleeps after ~15 min
# idle; the app's own warm-up ping (app.js) wakes it and shows an overlay
# while it does.
services:
  - type: web
    name: speechtoipa
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      # The bare major keeps picking up 24.x security patches instead of
      # freezing on one patch release. The server itself only needs Node 18+
      # (global fetch is its floor) — 24 is simply what it's tested against.
      - key: NODE_VERSION
        value: "24"
